<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 1200" width="896" height="1200">
  <defs>
    <!-- Leather grain texture -->
    <filter id="leatherGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="6" seed="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="textured"/>
      <feComponentTransfer in="textured">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>

    <!-- Subtle bump for embossed feel -->
    <filter id="emboss" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="4" seed="7" result="bump"/>
      <feDisplacementMap in="SourceGraphic" in2="bump" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- Gold foil text effect -->
    <filter id="goldText" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="15" result="goldNoise"/>
      <feColorMatrix in="goldNoise" type="matrix"
        values="0 0 0 0 0.85
                0 0 0 0 0.68
                0 0 0 0 0.22
                0 0 0 1 0" result="goldColor"/>
      <feComposite in="goldColor" in2="SourceGraphic" operator="in"/>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>

    <!-- Stitching pattern -->
    <pattern id="stitch" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="6" x2="6" y2="6" stroke="rgba(200,180,150,0.35)" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="6" y1="6" x2="12" y2="6" stroke="rgba(200,180,150,0)" stroke-width="1.5"/>
    </pattern>

    <!-- Radial vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(30,15,5,0.4)"/>
    </radialGradient>

    <!-- Spine shadow gradient -->
    <linearGradient id="spineShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="8%" stop-color="transparent"/>
      <stop offset="92%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)"/>
    </linearGradient>

    <!-- Title underline gradient -->
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="rgba(200,170,120,0.5)"/>
      <stop offset="80%" stop-color="rgba(200,170,120,0.5)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>

  <!-- Base leather color -->
  <rect width="896" height="1200" fill="#6B4226" rx="0"/>

  <!-- Leather grain overlay -->
  <rect width="896" height="1200" fill="#7A4E30" filter="url(#leatherGrain)" opacity="0.9"/>

  <!-- Warm leather highlight -->
  <rect width="896" height="1200" fill="url(#vignette)"/>

  <!-- Spine shadow -->
  <rect width="896" height="1200" fill="url(#spineShadow)"/>

  <!-- Leather edge wear (subtle lighter edges) -->
  <rect x="2" y="2" width="892" height="1196" rx="2" fill="none" stroke="rgba(120,85,50,0.3)" stroke-width="4"/>

  <!-- Inner stitching border -->
  <rect x="28" y="28" width="840" height="1144" rx="6" fill="none" stroke="rgba(200,180,150,0.25)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Decorative frame -->
  <rect x="55" y="55" width="786" height="1090" rx="8" fill="none" stroke="rgba(180,150,100,0.2)" stroke-width="1"/>

  <!-- Corner ornaments -->
  <!-- Top-left -->
  <path d="M 80 90 Q 80 80 90 80 L 140 80" fill="none" stroke="rgba(200,170,120,0.4)" stroke-width="1.5"/>
  <path d="M 80 90 Q 80 80 90 80 L 140 80" fill="none" stroke="rgba(200,170,120,0.4)" stroke-width="1.5" transform="translate(0,-6) scale(0.6) translate(0,10)" opacity="0.3"/>
  <circle cx="80" cy="90" r="2" fill="rgba(200,170,120,0.4)"/>

  <!-- Top-right -->
  <path d="M 816 90 Q 816 80 806 80 L 756 80" fill="none" stroke="rgba(200,170,120,0.4)" stroke-width="1.5"/>
  <circle cx="816" cy="90" r="2" fill="rgba(200,170,120,0.4)"/>

  <!-- Bottom-left -->
  <path d="M 80 1110 Q 80 1120 90 1120 L 140 1120" fill="none" stroke="rgba(200,170,120,0.4)" stroke-width="1.5"/>
  <circle cx="80" cy="1110" r="2" fill="rgba(200,170,120,0.4)"/>

  <!-- Bottom-right -->
  <path d="M 816 1110 Q 816 1120 806 1120 L 756 1120" fill="none" stroke="rgba(200,170,120,0.4)" stroke-width="1.5"/>
  <circle cx="816" cy="1110" r="2" fill="rgba(200,170,120,0.4)"/>

  <!-- Decorative line above title -->
  <line x1="280" y1="480" x2="616" y2="480" stroke="rgba(200,170,120,0.3)" stroke-width="0.8"/>
  <circle cx="448" cy="480" r="3" fill="none" stroke="rgba(200,170,120,0.4)" stroke-width="0.8"/>

  <!-- Main title: 回忆手帐 -->
  <text x="448" y="560" text-anchor="middle"
        font-family="'KaiTi', 'STKaiti', 'BiauKai', 'AR PL UKai CN', serif"
        font-size="82" font-weight="bold"
        fill="rgba(220,190,140,0.9)"
        letter-spacing="18"
        filter="url(#emboss)">
    回忆手帐
  </text>

  <!-- Gold shimmer overlay on text -->
  <text x="448" y="560" text-anchor="middle"
        font-family="'KaiTi', 'STKaiti', 'BiauKai', 'AR PL UKai CN', serif"
        font-size="82" font-weight="bold"
        fill="rgba(240,210,150,0.4)"
        letter-spacing="18"
        filter="url(#goldText)">
    回忆手帐
  </text>

  <!-- Decorative line below title -->
  <line x1="280" y1="600" x2="616" y2="600" stroke="rgba(200,170,120,0.3)" stroke-width="0.8"/>
  <circle cx="448" cy="600" r="3" fill="none" stroke="rgba(200,170,120,0.4)" stroke-width="0.8"/>

  <!-- Subtitle -->
  <text x="448" y="660" text-anchor="middle"
        font-family="'KaiTi', 'STKaiti', 'BiauKai', 'AR PL UKai CN', serif"
        font-size="24"
        fill="rgba(200,170,120,0.5)"
        letter-spacing="12">
    MEMORY BOOK
  </text>

  <!-- Small decorative dots -->
  <circle cx="418" cy="690" r="1.5" fill="rgba(200,170,120,0.3)"/>
  <circle cx="438" cy="690" r="1.5" fill="rgba(200,170,120,0.3)"/>
  <circle cx="458" cy="690" r="1.5" fill="rgba(200,170,120,0.3)"/>
  <circle cx="478" cy="690" r="1.5" fill="rgba(200,170,120,0.3)"/>

  <!-- Leather wear marks (subtle lighter scratches) -->
  <line x1="120" y1="350" x2="180" y2="345" stroke="rgba(100,70,40,0.15)" stroke-width="1"/>
  <line x1="650" y1="800" x2="730" y2="810" stroke="rgba(100,70,40,0.12)" stroke-width="0.8"/>
  <line x1="200" y1="950" x2="260" y2="948" stroke="rgba(100,70,40,0.1)" stroke-width="0.6"/>

  <!-- Subtle leather fold line at spine area -->
  <line x1="448" y1="0" x2="448" y2="1200" stroke="rgba(0,0,0,0.06)" stroke-width="2"/>
  <line x1="450" y1="0" x2="450" y2="1200" stroke="rgba(180,150,100,0.04)" stroke-width="1"/>
</svg>